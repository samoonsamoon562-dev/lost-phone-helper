<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Phone Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #d9534f;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      background: #eee;
    }

    #app {
      display: none;
    }

    .contact {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      background: #28a745;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="login" class="card">
    <h1>Lost Phone Helper</h1>

    <input
      id="email"
      type="email"
      placeholder="Enter email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>


  <div id="app" class="card">
    <h1>Lost Phone Helper</h1>

    <input
      id="name"
      type="text"
      placeholder="Enter owner name"
    >

    <input
      id="contact"
      type="tel"
      placeholder="Enter contact number"
    >

    <button onclick="saveInfo()">Save Information</button>

    <button class="logout" onclick="logout()">Logout</button>

    <div id="result" class="message"></div>
  </div>

</div>


<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDKpQ-GoohLHNxe8kKAn2czsuAaWZjs2DM",
    authDomain: "lost-phone-helper-4b5ac.firebaseapp.com",
    databaseURL: "https://lost-phone-helper-4b5ac-default-rtdb.firebaseio.com",
    projectId: "lost-phone-helper-4b5ac",
    storageBucket: "lost-phone-helper-4b5ac.firebasestorage.app",
    messagingSenderId: "159640605772",
    appId: "1:159640605772:web:1f2374a362735fd19fd0e9",
    measurementId: "G-G3CPYE7NMN"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);


  window.login = async function() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    message.style.display = "block";

    if (!email || !password) {
      message.textContent = "Please enter your email and password.";
      return;
    }

    message.textContent = "Logging in...";

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      message.textContent = "Login successful.";

    } catch (error) {

      console.error("Firebase Login Error:", error);

      if (error.code === "auth/invalid-credential") {
        message.textContent =
          "Incorrect email or password.";
      }

      else if (error.code === "auth/user-not-found") {
        message.textContent =
          "This email is not registered.";
      }

      else if (error.code === "auth/wrong-password") {
        message.textContent =
          "Incorrect password.";
      }

      else if (error.code === "auth/invalid-email") {
        message.textContent =
          "Invalid email address.";
      }

      else if (error.code === "auth/too-many-requests") {
        message.textContent =
          "Too many attempts. Try again later.";
      }

      else {
        message.textContent =
          "Login failed: " + error.code;
      }
    }
  };


  window.logout = async function() {

    try {
      await signOut(auth);
    } catch (error) {
      console.error(error);
    }
  };


  window.saveInfo = function() {

    const name =
      document.getElementById("name").value.trim();

    const contact =
      document.getElementById("contact").value.trim();

    const result =
      document.getElementById("result");


    if (!name || !contact) {

      result.style.display = "block";

      result.textContent =
        "Please enter the owner name and contact number.";

      return;
    }


    localStorage.setItem("ownerName", name);
    localStorage.setItem("ownerContact", contact);

    result.style.display = "block";

    result.innerHTML = `
      <strong>Phone Owner:</strong> ${name}<br>
      <strong>Contact:</strong> ${contact}<br>
      <a class="contact" href="tel:${contact}">
        📞 Call Owner
      </a>
    `;
  };


  onAuthStateChanged(auth, (user) => {

    const loginBox =
      document.getElementById("login");

    const appBox =
      document.getElementById("app");


    if (user) {

      loginBox.style.display = "none";
      appBox.style.display = "block";

      const savedName =
        localStorage.getItem("ownerName");

      const savedContact =
        localStorage.getItem("ownerContact");


      if (savedName) {
        document.getElementById("name").value =
          savedName;
      }

      if (savedContact) {
        document.getElementById("contact").value =
          savedContact;
      }

    } else {

      loginBox.style.display = "block";
      appBox.style.display = "none";
    }

  });

</script>

</body>
</html>
