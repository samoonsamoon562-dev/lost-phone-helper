<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Phone Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #0d5dcc;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f7ff;
      border-radius: 10px;
      display: none;
    }

    .contact {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #20a35a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>📱 Lost Phone Helper</h1>

      <p class="subtitle">
        Help return a lost phone to its owner.
      </p>

      <label for="name">Owner Name</label>
      <input id="name" type="text" placeholder="Enter owner name">

      <label for="contact">Contact Number</label>
      <input id="contact" type="tel" placeholder="Enter contact number">

      <button onclick="saveInfo()">Save Information</button>

      <div id="result"></div>

    </div>
  </div>

  <script>
    function saveInfo() {
      const name = document.getElementById("name").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const result = document.getElementById("result");

      if (!name || !contact) {
        result.style.display = "block";
        result.innerHTML = "⚠️ Please enter the owner name and contact number.";
        return;
      }

      localStorage.setItem("ownerName", name);
      localStorage.setItem("ownerContact", contact);

      result.style.display = "block";

      result.innerHTML = `
        <strong>Phone Owner:</strong> ${name}<br>
        <strong>Contact:</strong> ${contact}<br>
        <a class="contact" href="tel:${contact}">📞 Call Owner</a>
      `;
    }
  </script>

</body>
</html>
